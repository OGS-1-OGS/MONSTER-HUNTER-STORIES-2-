<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Hunter - Forgot Secret Code</title>
    <link rel="stylesheet" href="./MONSTER HUNTER STORIES 2_ 毁灭之翼 _ CAPCOM_files/forgot-password.css">
</head>

<body>
    <div class="decoration"></div>
    <div class="decoration"></div>
    <div class="decoration"></div>

    <div class="forgot-container">
        <div class="mh-logo">
            <h1 class="mh-title">Monster Hunter</h1>
            <p class="mh-subtitle">找回秘密口令</p>
        </div>

        <p class="form-info">输入你的骑士ID或注册邮箱，我们将向你发送重置口令的链接。</p>

        <div id="successMessage" class="success-message">
            重置链接已发送！请检查你的邮箱。
        </div>

        <form id="forgotForm" class="forgot-form">
            <div class="form-group">
                <label for="riderInfo" class="form-label">骑士ID或邮箱</label>
                <input type="text" id="riderInfo" name="riderInfo" class="form-input" placeholder="输入你的骑士名称或注册邮箱"
                    required>
                <div class="error-message" id="riderInfoError"></div>
            </div>

            <button type="submit" class="recover-button" id="recoverButton">
                <span id="buttonText">寻找口令</span>
            </button>
        </form>

        <div class="login-link">
            记起口令了？<a href="login.html" id="loginLink">返回登录</a>
        </div>

        <div class="register-link">
            还没有账号？<a href="register.html" id="registerLink">加入公会</a>
        </div>
    </div>

    <!-- Floating parallax elements -->
    <div class="parallax-element floating-icon" style="top: 20%; left: 10%;">🔍</div>
    <div class="parallax-element floating-icon" style="top: 60%; right: 15%;">📜</div>
    <div class="parallax-element floating-icon" style="top: 30%; right: 45%;">✨</div>
    <div class="parallax-element floating-icon" style="bottom: 20%; left: 40%;">🗝️</div>
    <div class="parallax-element floating-icon" style="bottom: 30%; left: 20%;">📫</div>

    <script>
        class MonsterHunterPasswordRecovery {
            constructor() {
                this.form = document.getElementById('forgotForm');
                this.riderInfoInput = document.getElementById('riderInfo');
                this.recoverButton = document.getElementById('recoverButton');
                this.buttonText = document.getElementById('buttonText');
                this.successMessage = document.getElementById('successMessage');

                this.init();
            }

            init() {
                this.bindEvents();
                this.addGameEffects();
            }

            bindEvents() {
                this.form.addEventListener('submit', (e) => this.handlePasswordRecovery(e));
                this.riderInfoInput.addEventListener('input', () => this.clearError('riderInfo'));

                document.getElementById('loginLink').addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = 'login.html';
                });

                document.getElementById('registerLink').addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = 'register.html';
                });
            }

            async handlePasswordRecovery(e) {
                e.preventDefault();

                if (this.recoverButton.classList.contains('loading')) {
                    return;
                }

                const riderInfo = this.riderInfoInput.value.trim();

                if (!this.validateRiderInfo(riderInfo)) {
                    return;
                }

                this.setRecoveringState(true);

                try {
                    // 模拟恢复过程
                    await new Promise(resolve => setTimeout(resolve, 2000));

                    // 检查是否有效的骑士ID或邮箱（模拟）
                    if (this.checkValidRider(riderInfo)) {
                        this.showRecoverySuccess();
                    } else {
                        this.showRecoveryError('riderInfo', '未找到该骑士ID或邮箱，请检查输入');
                        this.setRecoveringState(false);
                    }

                } catch (error) {
                    this.showRecoveryError('riderInfo', '连接猎团服务器失败，请稍后重试');
                    this.setRecoveringState(false);
                }
            }

            validateRiderInfo(riderInfo) {
                if (!riderInfo) {
                    this.showRecoveryError('riderInfo', '请输入你的骑士ID或注册邮箱');
                    return false;
                }
                return true;
            }

            checkValidRider(riderInfo) {
                // 怪物猎人主题的测试账户
                const validRiders = [
                    'rider',
                    'hunter@guild.com',
                    'navirou',
                    'alwin',
                    'kayna',
                    'hunter1',
                    'info@monsterhunter.com'
                ];

                return validRiders.includes(riderInfo.toLowerCase());
            }

            showRecoveryError(field, message) {
                const errorElement = document.getElementById(field + 'Error');
                this.riderInfoInput.classList.add('error');

                if (errorElement) {
                    errorElement.textContent = message;
                    errorElement.classList.add('show');
                }

                // 添加震动效果
                navigator.vibrate && navigator.vibrate(200);
            }

            clearError(field) {
                const errorElement = document.getElementById(field + 'Error');
                this.riderInfoInput.classList.remove('error');

                if (errorElement) {
                    errorElement.classList.remove('show');
                }
            }

            setRecoveringState(isRecovering) {
                if (isRecovering) {
                    this.recoverButton.classList.add('loading');
                    this.buttonText.textContent = '寻找中...';
                    this.recoverButton.disabled = true;
                } else {
                    this.recoverButton.classList.remove('loading');
                    this.buttonText.textContent = '寻找口令';
                    this.recoverButton.disabled = false;
                }
            }

            showRecoverySuccess() {
                this.form.style.display = 'none';
                this.successMessage.classList.add('show');
                this.playSuccessEffect();

                setTimeout(() => {
                    // Three seconds after success, return to login page
                    window.location.href = 'login.html';
                }, 5000);
            }

            playSuccessEffect() {
                // 创建简单的成功视觉效果
                const container = document.querySelector('.forgot-container');
                container.style.animation = 'none';
                setTimeout(() => {
                    container.style.animation = 'successPulse 0.6s ease-out';
                }, 10);
            }

            addGameEffects() {
                // 添加输入框的游戏风格效果
                const inputs = document.querySelectorAll('.form-input');
                inputs.forEach(input => {
                    input.addEventListener('focus', function () {
                        this.style.boxShadow = '0 0 25px rgba(255, 204, 0, 0.4), inset 0 1px 3px rgba(0, 0, 0, 0.3)';
                    });

                    input.addEventListener('blur', function () {
                        if (!this.value) {
                            this.style.boxShadow = '';
                        }
                    });
                });

                // 添加成功脉冲动画
                const style = document.createElement('style');
                style.textContent = `
          @keyframes successPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 204, 0, 0.6); }
            100% { transform: scale(1); }
          }
        `;
                document.head.appendChild(style);
            }
        }

        // 初始化怪物猎人找回口令系统
        document.addEventListener('DOMContentLoaded', () => {
            new MonsterHunterPasswordRecovery();
        });

        // Parallax effect for floating elements
        window.addEventListener('mousemove', (e) => {
            const parallaxElements = document.querySelectorAll('.parallax-element');
            const mouseX = e.clientX / window.innerWidth - 0.5;
            const mouseY = e.clientY / window.innerHeight - 0.5;

            parallaxElements.forEach((el, index) => {
                const speed = 20 + (index * 5);
                const x = mouseX * speed;
                const y = mouseY * speed;
                el.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>

</html>
